<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle for standard icon / maskable safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle radar / sensory wave rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.6" />
  <circle cx="256" cy="256" r="95" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" />

  <!-- Clinical Shield outline -->
  <path d="M 256 90 Q 340 100 370 180 C 370 290 280 370 256 405 C 232 370 142 290 142 180 Q 172 100 256 90 Z" 
        fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" />

  <!-- Biosignal ECG heartbeat waveform with predictive AI vector nodes -->
  <path d="M 170 260 L 205 260 L 220 225 L 240 310 L 260 170 L 285 330 L 305 240 L 320 260 L 345 260" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Predictive AI Intelligence Sensor Nodes -->
  <circle cx="260" cy="170" r="7" fill="#38bdf8" />
  <circle cx="285" cy="330" r="6" fill="#818cf8" />
  <circle cx="240" cy="310" r="5" fill="#38bdf8" />

  <!-- Core CarePulse Light Orb -->
  <circle cx="256" cy="256" r="16" fill="#38bdf8" opacity="0.25" />
</svg>
